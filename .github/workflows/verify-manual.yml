name: Manual startup verification
on:
  push:
    branches: [verification/pr17-manual]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: passwords
            scenarios: legacy newline stored-newline empty null omitted custom custom-newline custom-stored-newline custom-long
          - group: recovery
            scenarios: pending-before pending-after split-store unknown invalid-json fresh interrupted-init
          - group: reset
            scenarios: missing-store-old missing-store-new missing-readonly interrupted-reset
          - group: rotation
            scenarios: rotation-newline rotation-custom rotation-custom-newline rotation-pending rotation-split-store
          - group: channel
            scenarios: password-only rotation
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: bash -n docker-entrypoint.sh && bash -n docker-initunlocklnd.sh && bash -n docker-startup-tests.sh
      - name: Released LND integration
        env:
          TEST_SCENARIOS: ${{ matrix.scenarios }}
        run: bash docker-startup-tests.sh
  original-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Confirm original newline-password failure
        run: |
          baseline=$(mktemp -d)
          cp docker-startup-tests.sh "$baseline/"
          for script in docker-entrypoint.sh docker-initunlocklnd.sh; do
            git show d0b7990525cb73e75be8c80ec6ce51b6ff51732d:"$script" > "$baseline/$script"
            chmod +x "$baseline/$script"
          done
          if TEST_SCENARIOS=newline bash "$baseline/docker-startup-tests.sh" > baseline.log 2>&1; then
            echo 'Expected the original newline-password implementation to fail'; exit 1
          fi
          grep -q 'invalid passphrase for master public key' baseline.log
          grep -q 'Timed out waiting for ready' baseline.log
          echo 'PASS: reproduced original newline-password failure'
  no-macaroons-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the review claim against released LND
        run: |
          docker run --rm --entrypoint bash btcpayserver/lnd:v0.21.3-beta-1 -c '
            set -e
            /bin/lnd --lnddir=/data --bitcoin.active --bitcoin.regtest --bitcoin.node=bitcoind \
              --bitcoind.rpchost=127.0.0.1:18443 --bitcoind.rpcuser=test --bitcoind.rpcpass=test \
              --bitcoind.zmqpubrawblock=tcp://127.0.0.1:28332 --bitcoind.zmqpubrawtx=tcp://127.0.0.1:28333 \
              --no-macaroons --no-rest-tls --restlisten=127.0.0.1:8080 > /tmp/lnd.log 2>&1 &
            pid=$!
            trap "kill $pid || true" EXIT
            for ((i=0; i<30; i++)); do
              if curl -sf http://127.0.0.1:8080/v1/state | jq -e '\'' .state == "NON_EXISTING" '\''; then break; fi
              sleep 1
            done
            test -s /data/data/chain/bitcoin/regtest/macaroons.db || { cat /tmp/lnd.log; exit 1; }
            echo "PASS: no-macaroons still creates a nonempty macaroons.db before unlock"
          '
  architecture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64v8
          - platform: linux/arm/v7
            suffix: arm32v7
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - name: Check shell and filesystem primitives
        env:
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/source:ro" \
            --entrypoint bash "btcpayserver/lnd:v0.21.3-beta-1-$SUFFIX" -c '
              set -e
              bash -n /source/docker-entrypoint.sh
              bash -n /source/docker-initunlocklnd.sh
              bash -n /source/docker-startup-tests.sh
              umask 077
              temp=$(mktemp /data/credential.XXXXXX)
              printf value > "$temp"
              test "$(stat -c %a "$temp")" = 600
              sync "$temp" /data
              find /data -name "credential.*" -exec rm -f {} +
              test ! -e "$temp"
            '
