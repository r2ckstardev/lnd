name: Docker password handling

on:
  pull_request:
    paths:
      - docker-initunlocklnd.sh
      - docker-entrypoint.sh
      - docker-password-migration.sh
      - tests/test_docker_password_migration.py
      - tests/test_docker_password_integration.py
      - .github/workflows/docker-password-tests.yml
  push:
    paths:
      - docker-initunlocklnd.sh
      - docker-entrypoint.sh
      - docker-password-migration.sh
      - tests/test_docker_password_migration.py
      - tests/test_docker_password_integration.py
      - .github/workflows/docker-password-tests.yml

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash -n docker-initunlocklnd.sh docker-entrypoint.sh docker-password-migration.sh
      - run: python3 -m unittest discover -s tests -p test_docker_password_migration.py -v
      - run: python3 -m unittest discover -s tests -p test_docker_password_integration.py -v -f
