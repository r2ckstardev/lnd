name: Native macaroon rotation verification
on:
  push:
    branches: [verification/pr17-native-rotation]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: rotation-matrix
            scenarios: matrix-legacy-none matrix-legacy-V1 matrix-legacy-V2 matrix-default-none matrix-default-V1 matrix-default-V2 matrix-custom-none matrix-custom-V1 matrix-custom-V2 legacy-no-rotation
          - group: passwords
            scenarios: empty null omitted rotation-empty rotation-null rotation-omitted custom-spaces
          - group: historical-default
            scenarios: newline stored-newline rotation-newline rotation-stored-newline
          - group: pending
            scenarios: pending-before pending-after rotation-pending rotation-pending-after fresh
          - group: failures
            scenarios: missing-readonly rotation-missing-readonly rotation-missing-store split-store unknown invalid-json
          - group: channels-and-rotation
            scenarios: password-only rotation rotation-custom-spaces
          - group: copilot-regressions
            scenarios: fresh-rotation custom-dir
    steps:
      - uses: actions/checkout@v5
      - name: Record sources and check shell syntax
        run: |
          git hash-object docker-entrypoint.sh docker-initunlocklnd.sh btcpay/test-startup-tests.sh .github/workflows/btcpay-tests.yml
          for script in docker-entrypoint.sh docker-initunlocklnd.sh btcpay/test-startup-tests.sh; do bash -n "$script"; done
      - name: Released LND integration
        env:
          TEST_SCENARIOS: ${{ matrix.scenarios }}
        run: bash btcpay/test-startup-tests.sh
