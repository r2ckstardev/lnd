name: Shell startup verification
on:
  push:
    branches: [verification/shell-startup]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: passwords
            scenarios: legacy newline stored-newline empty null omitted custom custom-newline custom-stored-newline
          - group: recovery
            scenarios: pending-before pending-after missing-store-old missing-store-new missing-readonly split-store unknown invalid-json fresh interrupted-init
          - group: channel
            scenarios: password-only
          - group: recovery-only
            scenarios: recovery-rotation recovery-pending
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: |
          bash -n docker-entrypoint.sh
          bash -n docker-initunlocklnd.sh
          bash -n tests/docker-startup.sh
      - name: Supplementary failure injection (outside the PR)
        if: matrix.group == 'passwords'
        run: python3 .verification/test_shell_startup.py
      - name: Reproduce Copilot finding against the previous script
        if: matrix.group == 'recovery-only'
        run: |
          git fetch --no-tags --depth=1 origin fc1460b48e541ee5b8004ef9ce6019fad9e4ca6a
          git show FETCH_HEAD:docker-initunlocklnd.sh > /tmp/startup-before-review.sh
          if STARTUP_SCRIPT=/tmp/startup-before-review.sh python3 .verification/test_shell_startup.py \
              StartupTests.test_recovery_only_rotation StartupTests.test_recovery_only_pending_migration > /tmp/regression.log 2>&1; then
            cat /tmp/regression.log
            echo 'Expected both recovery-only cases to fail before the fix'
            exit 1
          fi
          cat /tmp/regression.log
          grep -q 'FAILED (failures=2)' /tmp/regression.log
          grep -q 'Filesystem error reading .*walletunlock.json' /tmp/regression.log
      - name: Released LND integration
        env:
          TEST_SCENARIOS: ${{ matrix.scenarios }}
        run: bash tests/docker-startup.sh
  architecture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm/v7
            suffix: arm32v7
          - platform: linux/arm64
            suffix: arm64v8
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - name: Run shell preflight in released architecture image
        env:
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -v "$PWD/docker-initunlocklnd.sh:/docker-initunlocklnd.sh:ro" \
            -e LND_DATA=/data --entrypoint bash "btcpayserver/lnd:v0.21.3-beta-1-$SUFFIX" -c '
              set -e
              bash -n /docker-initunlocklnd.sh
              printf "bitcoin.regtest=1\n" > /data/lnd.conf
              /docker-initunlocklnd.sh bitcoin regtest --prepare lnd
              test "$(stat -c %a /data/data/chain/bitcoin/regtest/walletunlock.json.recovery)" = 600
              jq -e ".initializing and (.password | length == 44)" /data/data/chain/bitcoin/regtest/walletunlock.json.recovery >/dev/null
            '
